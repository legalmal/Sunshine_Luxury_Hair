<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090909">
    <meta name="description" content="The page you are looking for could not be found. Explore Sunshine's Luxury Hair instead.">
    <title>Page Not Found | Sunshine's Luxury Hair</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/404.css">
    <link rel="icon" type="image/png" href="assets/logos/logo-dark.png">
</head>
<body>
    <div class="error-glow error-glow-one" aria-hidden="true"></div>
    <div class="error-glow error-glow-two" aria-hidden="true"></div>

    <header class="error-header">
        <a class="error-brand" href="index.html" aria-label="Sunshine's Luxury Hair home">
            <img src="assets/logos/logo-light.png" alt="Sunshine's Luxury Hair">
        </a>
        <a class="header-home-link" href="index.html">Back to home <span aria-hidden="true">↗</span></a>
    </header>

    <main class="error-main">
        <section class="error-card" aria-labelledby="error-title">
            <div class="error-art" aria-hidden="true">
                <span class="error-ring error-ring-one"></span>
                <span class="error-ring error-ring-two"></span>
                <span class="error-spark error-spark-one">✦</span>
                <span class="error-spark error-spark-two">✧</span>
                <span class="error-number">404</span>
            </div>

            <div class="error-copy">
                <p class="error-eyebrow"><span></span> A LITTLE DETOUR</p>
                <h1 id="error-title">This page is<br><em>out of style.</em></h1>
                <p class="error-description">We can’t find the page you’re looking for. It may have moved, or the link may be out of date.</p>
                <div class="error-actions">
                    <a class="error-button error-button-primary" href="index.html">Return home <span aria-hidden="true">→</span></a>
                    <a class="error-button error-button-secondary" href="shop.html">Explore the shop</a>
                </div>
                <p class="error-help">Need a hand? <a href="contact.html">Contact our team</a></p>
            </div>
        </section>
    </main>

    <footer class="error-footer">
        <span>© 2026 Sunshine's Luxury Hair</span>
        <span class="footer-dot" aria-hidden="true">✦</span>
        <span>Beauty in every detail</span>
    </footer>
</body>
</html>
